<svg width="400" height="400" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="200" height="200" rx="28" fill="#1B3A2F"/>

  <!-- open book, base -->
  <path d="M100,128 L40,142 L40,162 L100,148 Z" fill="#FFCC00"/>
  <path d="M100,128 L160,142 L160,162 L100,148 Z" fill="#FFCC00"/>
  <line x1="100" y1="128" x2="100" y2="148" stroke="#1B3A2F" stroke-width="2.5"/>

  <!-- pen rising from the book's spine -->
  <path d="M100,40 L80,108 L100,136 L120,108 Z" fill="#FBF6EE"/>
  <!-- circuit-trace slit inside the pen -->
  <path d="M100,48 L100,74 L94,80 L94,94 L100,100 L100,118" fill="none" stroke="#1B3A2F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- network / nexus burst at the pen's tip -->
  <line x1="100" y1="40" x2="74" y2="14" stroke="#FFCC00" stroke-width="3" stroke-linecap="round"/>
  <line x1="100" y1="40" x2="100" y2="6" stroke="#FFCC00" stroke-width="3" stroke-linecap="round"/>
  <line x1="100" y1="40" x2="126" y2="14" stroke="#FFCC00" stroke-width="3" stroke-linecap="round"/>
  <line x1="74" y1="14" x2="100" y2="6" stroke="#FFCC00" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="126" y1="14" x2="100" y2="6" stroke="#FFCC00" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <circle cx="100" cy="40" r="6" fill="#FFCC00"/>
  <circle cx="74" cy="14" r="7" fill="#FFCC00"/>
  <circle cx="100" cy="6" r="7.5" fill="#FFCC00"/>
  <circle cx="126" cy="14" r="7" fill="#FFCC00"/>
</svg>
