<svg width="400" height="400" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="round"><rect x="0" y="0" width="200" height="200" rx="28"/></clipPath>
  </defs>

  <rect x="0" y="0" width="200" height="200" rx="28" fill="#1B3A2F"/>

  <g clip-path="url(#round)">
    <!-- pen nib body -->
    <path d="M100,158 L72,66 Q100,42 128,66 Z" fill="#FBF6EE"/>
    <!-- circuit-trace slit -->
    <path d="M100,150 L100,118 L94,112 L94,96 L100,90 L100,82" fill="none" stroke="#1B3A2F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- chip-style nib hole -->
    <rect x="92" y="76" width="16" height="16" rx="3" fill="#1B3A2F"/>

    <!-- network / nexus burst growing from the nib -->
    <line x1="100" y1="60" x2="70" y2="34" stroke="#FFCC00" stroke-width="3" stroke-linecap="round"/>
    <line x1="100" y1="60" x2="100" y2="24" stroke="#FFCC00" stroke-width="3" stroke-linecap="round"/>
    <line x1="100" y1="60" x2="130" y2="34" stroke="#FFCC00" stroke-width="3" stroke-linecap="round"/>
    <line x1="70" y1="34" x2="100" y2="24" stroke="#FFCC00" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="130" y1="34" x2="100" y2="24" stroke="#FFCC00" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <rect x="94" y="54" width="12" height="12" rx="3" fill="#FFCC00"/>
    <circle cx="70" cy="34" r="7" fill="#FFCC00"/>
    <circle cx="100" cy="24" r="8" fill="#FFCC00"/>
    <circle cx="130" cy="34" r="7" fill="#FFCC00"/>
  </g>
</svg>
